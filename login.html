<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Login Page</h2>

    <form autocomplete="off" class="form" id="Login">
        <input autocomplete="email" type="email" placeholder="Enter Email" id="email" name="email">
        <input autocomplete="current-password" type="password" placeholder="Enter Passwoord" id="password" name="password">

        <p id="error"></p>
        <button>Submit</button>
    </form>


    <script src="main2.js"></script>
</body>
</html>
