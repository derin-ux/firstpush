<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>Sign Up Page</h2>
    <form autocomplete="off" class="form" id="SignUp">
        <input autocomplete="name" type="text" placeholder="Enter your name" id="fullname" name="fullname">
        <input autocomplete="email" type="email" placeholder="Enter your email" id="email" name="email">
        <input autocomplete="new-password" type="password" placeholder="Enter your password" id="password"name="password">
        <input autocomplete="confirm-password" type="password" placeholder="Confirm password" id="confirmPassword" name="confirmPassword">
        <p id="error"></p>
        <button>Submit</button>
    </form>

    <script src="main.js"></script>
</body>

</html>
